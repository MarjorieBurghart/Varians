name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Les trois systèmes des archives, avec Python 3.12 (celui des
        # archives) ; Python 3.13 en plus sous Linux (V0.9.4.6).
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    env:
      # Qt sans écran : l'application graphique est pilotée par les tests.
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Dossier temporaire à nom long (Windows)
        # Le TEMP par défaut du serveur Windows est un nom court 8.3
        # (C:\Users\RUNNER~1\...) ; Varians normalise les chemins en noms
        # longs, ce qui fausse les comparaisons de chemins de certains tests.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Dossier temporaire sans lien symbolique (macOS)
        # /var/folders/… est un lien vers /private/var/… : Varians résout
        # les chemins, ce qui fausserait les comparaisons de chemins des
        # tests, comme le nom court 8.3 sous Windows.
        if: runner.os == 'macOS'
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Bibliothèques système pour Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Dépendances
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Compilation de tous les modules
        run: python -m compileall -q .

      - name: Tests
        run: python -m pytest -q --disable-warnings
