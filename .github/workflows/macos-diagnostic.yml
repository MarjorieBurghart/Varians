# Diagnostic macOS (temporaire, V0.9.4.6) : la suite sous macOS, chaque test
# nommé, pour trouver ce qui y échoue ou s'y bloque. Il sera retiré quand
# macOS rejoindra le workflow Tests.
name: Diagnostic macOS

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS / interface et sonde QProcess
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      # Sonde : un QProcess de contrôle après chaque test (voir le module).
      PYTHONPATH: .github/macos-diagnostic
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Dossier temporaire sans lien symbolique
        # /var/folders/… est un lien vers /private/var/…, que Varians résout.
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Dépendances
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Tests de l'interface sous macOS, avec la sonde
        # Chaque test nommé (-v) ; après chaque test, la fin d'un QProcess de
        # contrôle et le gestionnaire de SIGCHLD ; arrêt au premier test après
        # lequel la fin n'arrive plus. Un test qui dépasse 10 minutes : pile
        # d'appels affichée.
        run: python -m pytest tests/gui -v -s -rfE --tb=short -p no:cacheprovider -p varians_macos_probe -o faulthandler_timeout=600
