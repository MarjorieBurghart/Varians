# Diagnostic macOS (temporaire, V0.9.4.6) : la suite sous macOS, chaque test
# nommé, pour trouver ce qui y échoue ou s'y bloque. Il sera retiré quand
# macOS rejoindra le workflow Tests.
name: Diagnostic macOS

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS / suite complète
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Dossier temporaire sans lien symbolique
        # /var/folders/… est un lien vers /private/var/…, que Varians résout.
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Dépendances
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Suite complète sous macOS
        # Chaque test nommé (-v) ; un test qui dépasse 10 minutes : pile
        # d'appels affichée ; les échecs résumés en fin de passe.
        run: python -m pytest -v -rfE --tb=short -p no:cacheprovider -o faulthandler_timeout=600
