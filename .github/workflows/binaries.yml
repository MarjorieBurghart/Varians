name: Binaries

# Version prête à l'emploi de Varians, sans Python à installer : Windows,
# macOS (Apple Silicon et Intel) et Linux. Chaque archive est construite par
# packaging/build.py, qui vérifie l'exécutable construit (« Varians
# --self-test », avec le module d'affichage du système : fenêtre comprise)
# avant de le zipper.
#
# - Release publiée : les archives et leurs empreintes (.sha256) sont
#   jointes à la release.
# - À la main (Actions ▸ Binaries ▸ Run workflow) : construites depuis la
#   branche ou le tag choisi, téléchargeables dans le résumé du workflow ;
#   si « tag » est rempli, jointes aussi à la release de ce tag (la version
#   de Varians construite doit être celle du tag).
# - Modification de la recette (packaging/, ce fichier) : construction et
#   vérification seulement.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release à laquelle joindre les archives (ex. v0.9.4.0) ; vide : résumé du workflow seulement"
        required: false
        default: ""
  push:
    paths:
      - "packaging/**"
      - ".github/workflows/binaries.yml"
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/binaries.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            display: windows
          - name: macOS (Apple Silicon)
            os: macos-latest
            display: cocoa
          - name: macOS (Intel)
            os: macos-15-intel
            display: cocoa
          # La plus ancienne Ubuntu disponible : l'archive marche sur les
          # systèmes au moins aussi récents (glibc 2.35).
          - name: Linux
            os: ubuntu-22.04
            display: xcb
    env:
      PYTHONUTF8: "1"
      # Vérification avec le module d'affichage du système (pas « offscreen »).
      QT_QPA_PLATFORM: ${{ matrix.display }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dossier temporaire à nom long (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Bibliothèques système (Linux)
        # Les bibliothèques xcb utilitaires présentes à la construction sont
        # emportées dans l'archive ; Xvfb sert à la vérification.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xkb1 libxcb-util1 libxcb-shape0 libxcb-randr0 libxcb-xinerama0 xvfb

      - name: Dépendances
        run: python -m pip install -r requirements.txt -r packaging/requirements.txt -c constraints.txt

      - name: Construction et vérification
        id: build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python packaging/build.py
          else
            python packaging/build.py
          fi

      - name: Archive
        uses: actions/upload-artifact@v6
        with:
          name: Varians-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0

      - name: Rapport de vérification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diagnostic-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/binaries/self-test-*.json
            build/binaries/work/varians/warn-varians.txt
          if-no-files-found: ignore

  release:
    name: Jointes à la release
    needs: build
    # Les archives construites sont jointes même si un système a échoué
    # (le workflow reste en échec).
    if: ${{ !cancelled() && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: Varians-*
          merge-multiple: true
          path: archives

      - name: Version construite = version du tag
        shell: bash
        run: |
          version="${TAG#[vV]}"
          ls -l archives
          for file in archives/*; do
            case "$(basename "$file")" in
              "Varians-$version-"*) ;;
              *) echo "::error::$(basename "$file") n'est pas la version $version du tag $TAG"; exit 1 ;;
            esac
          done

      - name: Envoi
        run: gh release upload "$TAG" archives/* --clobber --repo "$GITHUB_REPOSITORY"
